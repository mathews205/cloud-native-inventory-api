stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Database URL used by the application and Alembic migrations in CI
  DATABASE_URL: "postgresql://inventory_user:inventory_password@postgres:5432/inventory_db"

cache:
  paths:
    - .cache/pip

test:
  stage: test
  image: python:3.13-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: inventory_user
    POSTGRES_PASSWORD: inventory_password
    POSTGRES_DB: inventory_db
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements.txt
    # Give Postgres a moment to start before running migrations
    - apt-get update && apt-get install -y postgresql-client
    - until pg_isready -h postgres -p 5432 -U inventory_user -d inventory_db; do echo "Waiting for PostgreSQL..."; sleep 1; done
    - alembic upgrade head
  script:
    - pytest
